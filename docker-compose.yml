services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aula_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aula_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
